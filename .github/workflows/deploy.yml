# Every push to main deploys to Cloudflare Pages.
#
# Direct upload, not a Git connection: connecting the repo in the Cloudflare
# dashboard needs an OAuth click, and this avoids it entirely. The push IS the
# deploy, so nothing drifts.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name points-lp --branch main
